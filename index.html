<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Empleo Dev — Bogotá / Remoto · 9 nov 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'><rect width='8' height='8' fill='black'/><rect x='2' y='2' width='4' height='4' fill='white'/><rect x='3' y='3' width='2' height='2' fill='black'/></svg>">
<style>
@font-face{font-family:'Geist';src:url('https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Geist';src:url('https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-sans/Geist-Medium.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'Geist';src:url('https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-sans/Geist-SemiBold.woff2') format('woff2');font-weight:600;font-display:swap}
@font-face{font-family:'Geist Mono';src:url('https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#666;--line:#e5e5e5;--chip:#f0f0f0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Geist',Inter,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.px{width:16px;height:16px;flex:none;background:
  conic-gradient(from 90deg at 50% 50%,#000 90deg,transparent 0) 0 0/8px 8px,#000;
  clip-path:polygon(0 0,100% 0,100% 37.5%,62.5% 37.5%,62.5% 62.5%,100% 62.5%,100% 100%,0 100%,0 62.5%,37.5% 62.5%,37.5% 37.5%,0 37.5%)}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-bottom:24px}
.sub code{font-family:'Geist Mono',monospace;font-size:12px;background:var(--chip);padding:1px 6px}
.filters{position:sticky;top:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;z-index:5}
.filters input,.filters select{font:inherit;font-size:13px;color:var(--fg);background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:0;outline:none;image-rendering:pixelated}
.filters input:focus,.filters select:focus{border-color:var(--fg)}
.filters input{flex:1 1 200px}
.count{font-family:'Geist Mono',monospace;font-size:12px;color:var(--mut);padding:10px 0 4px}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:-1px}
.card:hover{border-color:var(--fg)}
.card h2{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.card h2 a{color:var(--fg);text-decoration:none}
.card h2 a:hover{text-decoration:underline}
.co{font-size:13px;color:var(--mut);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-family:'Geist Mono',monospace;font-size:11px;background:var(--chip);border:1px solid var(--line);padding:2px 7px;color:#333;cursor:pointer}
.tag.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.why{font-size:13px;color:#333}
.why b{font-weight:600}
.src{font-family:'Geist Mono',monospace;font-size:11px;color:var(--mut);margin-top:8px}
.empty{padding:40px 0;color:var(--mut);text-align:center;display:none}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
footer a{color:var(--fg)}
@media(max-width:560px){.wrap{padding:28px 14px 60px}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="px"></div><h1>empleo-dev / bogotá-remoto</h1></header>
<p class="sub">16 ofertas · 9 nov 2026 · junior → senior · <code>sin SENA / sin pasantías</code></p>
<div class="filters">
<input id="q" type="search" placeholder="Buscar: java, react, n8n, remoto…" autocomplete="off">
<select id="fFuente"><option value="">Fuente: todas</option><option>elempleo</option><option>GetOnBrd</option><option>Computrabajo</option></select>
<select id="fMod"><option value="">Modalidad: todas</option><option>Bogotá</option><option>Híbrido</option><option>Remoto</option></select>
<select id="fNiv"><option value="">Nivel: todos</option><option value="junior">Junior</option><option value="semi">Semi-senior</option><option value="senior">Senior</option></select>
<select id="fOrd"><option value="rel">Orden: relevancia</option><option value="sal">Salario ↓</option></select>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
<div class="empty" id="empty">∅ sin resultados — ajusta los filtros</div>
<footer>Fuentes: elempleo · GetOnBrd — Hecho para <a href="https://dilan-albert-murcia-parra.netlify.app/es/">dilan-albert-murcia-parra.netlify.app/es</a></footer>
</div>
<script>
const JOBS=[
{t:"Desarrollador Java + Angular + AWS",e:"Digital Profit Colombia",m:"Hibrido",c:"Indefinido",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-java-angular-aws-1886742119",f:"elempleo",n:"semi",w:"Java + Angular + AWS en Bogotá híbrida, tu trío WhisWhim exacto."},
{t:"Desarrollador Fullstack Java/Angular/AWS remoto",e:"Empresa confidencial",m:"Remoto",c:"Indefinido",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-fullstack-java-angular-aws-remoto-1886745858",f:"elempleo",n:"semi",w:"Microservicios Spring Boot + Oracle + AWS 100% remoto."},
{t:"Desarrollador Java Senior",e:"Indra Colombia",m:"Remoto",c:"Indefinido",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-java-senior-1886758848",f:"elempleo",n:"senior",w:"APIs REST + Docker + Kafka + Copilot, remoto con multinacional."},
{t:"Desarrollador Java 100% remoto con inglés B2",e:"Adecco Colombia",m:"Remoto",c:"Indefinido",s:"Tope $10M",u:"https://www.elempleo.com/co/ofertas-trabajo/100-remoto-desarrollador-java-con-ingles-conversacional-b2-o-superior-1886753942",f:"elempleo",n:"semi",w:"Mejor salario remoto de la tanda, inglés conversacional requerido."},
{t:"Desarrollador Java remoto (Java 21)",e:"Empresa confidencial",m:"Remoto",c:"Tiempo completo",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-java-remoto-1886757667",f:"elempleo",n:"junior",w:"Pide Java 21 + Spring Boot desde 2 años, tu perfil justo."},
{t:"Desarrollador Full Stack Semi Senior (Java, Angular)",e:"Manpower",m:"Remoto",c:"Indefinido",s:"$5,5 a $6M",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-a-full-stack-semi-senior-remoto-1886779488",f:"elempleo",n:"semi",w:"Java + Spring Boot + Angular remoto con salario publicado."},
{t:"Desarrollador Fullstack remoto (React + Node)",e:"Michael Page",m:"Remoto",c:"Indefinido",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-fullstack-remoto-1886779805",f:"elempleo",n:"semi",w:"React + Node + Docker + IA, calce directo con MeetFlow."},
{t:"Desarrollador Java SemiSr en aseguradora",e:"Indra Colombia",m:"Remoto",c:"Tiempo completo",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-java-semisrexp-en-aseguradoratrabajo-remoto-colombia-1886745602",f:"elempleo",n:"semi",w:"Java remoto en sector asegurador, transformación digital."},
{t:"Desarrollador Full Stack web y móvil",e:"Digital Profit Colombia",m:"Hibrido",c:"Indefinido",s:"",u:"https://www.elempleo.com/co/ofertas-trabajo/desarrollador-full-stack-web-y-movil-ionic-angular-java-1886757476",f:"elempleo",n:"semi",w:"Java Spring Boot + Angular + Ionic en banca, híbrida Bogotá."},
{t:"Solutions Architect (NestJS + Node)",e:"Interfell para Monday",m:"Remoto",c:"Full-time",s:"USD 2000-2500/mes",u:"https://www.getonbrd.com/empleos/programacion/solutions-architect-interfell-remote",f:"GetOnBrd",n:"semi",w:"NestJS + Node + AWS, tu backend Express trasladable."},
{t:"Full-Stack Engineer Senior (Node.js, React, AWS)",e:"Continuum",m:"Remoto",c:"Full-time",s:"USD 3000-3600/mes",u:"https://www.getonbrd.com/empleos/programacion/fullstack-engineer-senior-node-js-react-aws-continuum-remote",f:"GetOnBrd",n:"senior",w:"Node + React + AWS, tu stack MeetFlow en dólares."},
{t:"Full-Stack Developer Node.js + React + AWS",e:"BC Tecnología para Cencosud",m:"Remoto",c:"Full-time",s:"USD",u:"https://www.getonbrd.com/empleos/programacion/fullstack-developer-node-js-typescript-react-aws-bc-tecnologia-remote",f:"GetOnBrd",n:"semi",w:"TypeScript + React + microservicios, remoto LatAm."},
{t:"Software Engineer (.NET & Azure)",e:"Improving",m:"Remoto",c:"Full-time",s:"USD",u:"https://www.getonbrd.com/jobs/programming/software-engineer-net-azure-improving-remote",f:"GetOnBrd",n:"senior",w:"Ingeniería senior remota con IA y automatización, publicada 6 nov."},
{t:"Full-Stack Engineer (React / .NET / AWS)",e:"Improving",m:"Remoto",c:"Full-time",s:"USD",u:"https://www.getonbrd.com/empleos/programacion/full-stack-engineer-react-net-aws-improving-remote",f:"GetOnBrd",n:"semi",w:"React + PostgreSQL + AWS, tu frontend con base de datos."},
{t:"Full-Stack Python Developer",e:"CreativeWorks para Ravin",m:"Remoto",c:"Full-time",s:"USD 1500-2000/mes",u:"https://www.getonbrd.com/empleos/programacion/full-stack-python-developer-creativeworks-remote",f:"GetOnBrd",n:"semi",w:"E-commerce full-stack con PostgreSQL + AWS en remoto."},
{t:"Senior Software Engineer Serverless",e:"Hyqoo",m:"Remoto",c:"Full-time",s:"USD 3000-4500/mes",u:"https://www.getonbrd.com/empleos/programacion/senior-software-engineer-serverless-workflow-hyqoo-remote",f:"GetOnBrd",n:"senior",w:"Backend cloud-native + Docker + CI/CD, el tramo alto en USD."}
];
function salVal(s){const m=String(s||"").match(/\$([\d.,]+)/);if(!m)return -1;return parseFloat(m[1].replace(",","."));}
function render(){
const q=document.getElementById('q').value.toLowerCase(),
ff=document.getElementById('fFuente').value,
fm=document.getElementById('fMod').value,
fn=document.getElementById('fNiv').value,
ord=document.getElementById('fOrd').value;
let r=JOBS.filter(j=>{
if(ff&&j.f!==ff)return false;
if(fm==="Bogotá"&&!/bogot/i.test(j.m))return false;
if(fm==="Híbrido"&&j.m!=="Híbrido")return false;
if(fm==="Remoto"&&j.m!=="Remoto")return false;
if(fn&&j.n!==fn)return false;
if(q&&!((j.t+" "+j.e+" "+j.m+" "+j.w).toLowerCase().includes(q)))return false;
return true;});
if(ord==="sal")r=r.slice().sort((a,b)=>salVal(b.s)-salVal(a.s));
document.getElementById('count').textContent=r.length+" / "+JOBS.length+" ofertas";
document.getElementById('empty').style.display=r.length?"none":"block";
document.getElementById('list').innerHTML=r.map(j=>
`<div class="card"><h2><a href="${j.u}" target="_blank" rel="noopener">${j.t}</a></h2><div class="co">${j.e}</div><div class="tags"><span class="tag">${j.m}</span>${j.c?`<span class="tag">${j.c}</span>`:""}${j.s?`<span class="tag">${j.s}</span>`:""}<span class="tag">${j.n}</span></div><div class="why"><b>Por qué encaja:</b> ${j.w}</div><div class="src">↗ ${j.f} · aplicar en pestaña nueva</div></div>`).join("");
}
["q","fFuente","fMod","fNiv","fOrd"].forEach(id=>{
document.getElementById(id).addEventListener("input",render);
document.getElementById(id).addEventListener("change",render);});
render();
</script>
</body>
</html>

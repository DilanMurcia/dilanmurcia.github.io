<style>
@font-face{font-family:'Geist';src:url('https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-sans/Geist-Regular.woff2') format('woff2');font-weight:400;font-display:swap}

@font-face{font-family:'Geist Mono';src:url('https://cdn.jsdelivr.net/npm/geist@1.4.2/dist/fonts/geist-mono/GeistMono-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
:root{--bg:#fafafa;--fg:#0a0a0a;--mut:#666;--line:#e5e5e5;--chip:#f0f0f0}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Geist',Inter,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:48px 20px 80px}
header{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.px{width:16px;height:16px;flex:none;background:
  conic-gradient(from 90deg at 50% 50%,#000 90deg,transparent 0) 0 0/8px 8px,#000;
  clip-path:polygon(0 0,100% 0,100% 37.5%,62.5% 37.5%,62.5% 62.5%,100% 62.5%,100% 100%,0 100%,0 62.5%,37.5% 62.5%,37.5% 37.5%,0 37.5%)}
h1{font-size:20px;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--mut);font-size:13px;margin-bottom:24px}
.sub code{font-family:'Geist Mono',monospace;font-size:12px;background:var(--chip);padding:1px 6px}
.filters{position:sticky;top:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--fg);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px;z-index:5}
.filters input,.filters select{font:inherit;font-size:13px;color:var(--fg);background:#fff;border:1px solid var(--line);padding:7px 10px;border-radius:0;outline:none;image-rendering:pixelated}
.filters input:focus,.filters select:focus{border-color:var(--fg)}
.filters input{flex:1 1 200px}
.count{font-family:'Geist Mono',monospace;font-size:12px;color:var(--mut);padding:10px 0 4px}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:-1px}
.card:hover{border-color:var(--fg)}
.card h2{font-size:14px;font-weight:600;letter-spacing:-.01em;margin-bottom:2px}
.card h2 a{color:var(--fg);text-decoration:none}
.card h2 a:hover{text-decoration:underline}
.co{font-size:13px;color:var(--mut);margin-bottom:8px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-family:'Geist Mono',monospace;font-size:11px;background:var(--chip);border:1px solid var(--line);padding:2px 7px;color:#333;cursor:pointer}
.tag.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.why{font-size:13px;color:#333}
.why b{font-weight:600}
.src{font-family:'Geist Mono',monospace;font-size:11px;color:var(--mut);margin-top:8px}
.empty{padding:40px 0;color:var(--mut);text-align:center;display:none}
footer{margin-top:32px;padding-top:16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
footer a{color:var(--fg)}
@media(max-width:560px){.wrap{padding:28px 14px 60px}}
</style>
</head>
<body>
<div class="wrap">

<p class="sub">17 ofertas · 9 nov 2026 · junior → senior · <code>sin SENA / sin pasantías</code></p>
<div class="filters">

<select id="fFuente"><option value="">Fuente: todas</option><option>LinkedIn</option><option>Indeed</option><option>Computrabajo</option><option>elempleo</option></select>

<select id="fOrd"><option value="rel">Orden: relevancia</option><option value="sal">Salario ↓</option></select>
</div>
<div class="count" id="count"></div>
<div id="list"></div>
<div class="empty" id="empty">∅ sin resultados — ajusta los filtros</div>
<footer>Fuentes: LinkedIn · Indeed CO · Computrabajo CO · elempleo — vía Apify · Hecho para <a href="https://dilan-albert-murcia-parra.netlify.app/es/">dilan-albert-murcia-parra.netlify.app/es</a></footer>
</div>

{t:"Full Stack SSR .Net + React",e:"SIIGO S.A.S.",m:"Remoto",c:"Tiempo completo",s:"",u:"https://co.computrabajo.com/ofertas-de-trabajo/oferta-de-trabajo-de-full-stack-ssr-net-react-en-bogota-dc-DCDD8A8B0ECDA33D61373E686DCF3405",f:"Computrabajo",n:"semi",w:"React remoto en Siigo, tu frontend TypeScript aplica."},

{t:"Desarrollador II Full Stack",e:"FINANZAUTO S.A. BIC",m:"Remoto",c:"Tiempo completo",s:"$5,5M",u:"https://co.computrabajo.com/ofertas-de-trabajo/oferta-de-trabajo-de-desarrollador-ii-full-stack-scrum-kanban-o-safe-remoto-en-bogota-dc-4C359B69157465DB61373E686DCF3405",f:"Computrabajo",n:"semi",w:"Nivel II remoto con buen salario, postula a I y II juntos."},

{t:"Full-Stack Software Engineer (React + Python)",e:"Improving",m:"Remoto",c:"Full-time",s:"USD",u:"https://www.getonbrd.com/jobs/programacion/full-stack-software-engineer-react-python-improving-remote",f:"GetOnBrd",n:"semi",w:"React + Python remoto, publicado el 8 nov."},

];
function salVal(s){const m=String(s||"").match(/\$([\d.,]+)/);if(!m)return -1;return parseFloat(m[1].replace(",","."));}
function render(){
const q=document.getElementById('q').value.toLowerCase(),
ff=document.getElementById('fFuente').value,
fm=document.getElementById('fMod').value,
fn=document.getElementById('fNiv').value,
ord=document.getElementById('fOrd').value;
let r=JOBS.filter(j=>{
if(ff&&j.f!==ff)return false;
if(fm==="Bogotá"&&!/bogot/i.test(j.m))return false;
if(fm==="Híbrido"&&j.m!=="Híbrido")return false;
if(fm==="Remoto"&&j.m!=="Remoto")return false;
if(fn&&j.n!==fn)return false;
if(q&&!((j.t+" "+j.e+" "+j.m+" "+j.w).toLowerCase().includes(q)))return false;
return true;});
if(ord==="sal")r=r.slice().sort((a,b)=>salVal(b.s)-salVal(a.s));
document.getElementById('count').textContent=r.length+" / "+JOBS.length+" ofertas";
document.getElementById('empty').style.display=r.length?"none":"block";
document.getElementById('list').innerHTML=r.map(j=>
`<div class="card"><h2><a href="${j.u}" target="_blank" rel="noopener">${j.t}</a></h2><div class="co">${j.e}</div><div class="tags"><span class="tag">${j.m}</span>${j.c?`<span class="tag">${j.c}</span>`:""}${j.s?`<span class="tag">${j.s}</span>`:""}<span class="tag">${j.n}</span></div><div class="why"><b>Por qué encaja:</b> ${j.w}</div><div class="src">↗ ${j.f} · aplicar en pestaña nueva</div></div>`).join("");
}
["q","fFuente","fMod","fNiv","fOrd"].forEach(id=>{
document.getElementById(id).addEventListener("input",render);
document.getElementById(id).addEventListener("change",render);});
render();
</script>
